<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/qrcode.js"></script>
<title>Tasks</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #fbfcfd;
    --border: #eceef2;
    --text: #11151c;
    --text-2: #5b6573;
    --text-3: #9aa3b2;
    --accent: #1f6feb;
    --accent-soft: #eaf1fe;
    --ink: #0b1220;
    --red: #d92d4f;
    --red-soft: #fdecef;
    --amber: #b7791f;
    --amber-soft: #fbf5e9;
    --green: #1a8f5e;
    --green-soft: #e8f6ef;
    --shadow-sm: 0 1px 2px rgba(11,18,32,0.04);
    --shadow: 0 2px 8px rgba(11,18,32,0.05), 0 1px 2px rgba(11,18,32,0.04);
    --shadow-lg: 0 18px 50px rgba(11,18,32,0.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    padding-bottom:calc(104px + env(safe-area-inset-bottom)); line-height:1.5; letter-spacing:-0.01em;
  }
  svg { display:block; }
  .icon { width:18px; height:18px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .icon-sm { width:13px; height:13px; stroke-width:2; }

  /* Header */
  .header {
    background:linear-gradient(180deg, var(--ink) 0%, #121a2b 100%);
    color:#fff; padding:calc(22px + env(safe-area-inset-top)) 22px 26px;
    border-radius:0 0 26px 26px; position:relative; overflow:hidden;
  }
  .header::after { content:''; position:absolute; top:-60px; right:-40px; width:200px; height:200px; background:radial-gradient(circle, rgba(31,111,235,0.35), transparent 70%); }
  .header-top { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .brand { font-size:23px; font-weight:700; letter-spacing:-0.5px; }
  .brand span { color:#6ea8fe; }
  .header-date { font-size:12.5px; color:rgba(255,255,255,0.6); font-weight:500; text-align:right; }
  .lan { display:flex; flex-direction:column; align-items:stretch; gap:10px; margin-top:16px; position:relative; z-index:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px; }
  .lan-text { min-width:0; }
  .lan-label { font-size:11px; color:rgba(255,255,255,0.6); font-weight:600; }
  .lan-url { font-size:12.5px; font-weight:700; word-break:break-all; margin-top:2px; user-select:text; }
  .lan-meta { font-size:11px; color:rgba(255,255,255,0.55); margin-top:2px; }
  .lan-state { font-size:11px; margin-top:3px; color:#9ad0ff; }
  .lan-state.wait { color:#ffd089; }
  .lan img, #lanScan { width:100%; height:auto; aspect-ratio:1; max-height:320px; object-fit:contain; border-radius:12px; background:#fff; }
  .hero { display:flex; align-items:center; gap:22px; margin-top:16px; position:relative; z-index:1; }
  .ring { position:relative; width:84px; height:84px; flex-shrink:0; }
  .ring svg { width:84px; height:84px; transform:rotate(-90deg); }
  .ring .bg { stroke:rgba(255,255,255,0.12); }
  .ring .fg { stroke:#6ea8fe; stroke-linecap:round; transition:stroke-dashoffset 0.6s cubic-bezier(0.16,1,0.3,1); }
  .ring .pct { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .pct b { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
  .ring .pct s { font-size:9px; text-decoration:none; color:rgba(255,255,255,0.55); margin-top:-2px; }
  .hstats { display:flex; gap:8px; flex:1; }
  .hstat { flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:11px 12px; backdrop-filter:blur(8px); }
  .hstat .n { font-size:19px; font-weight:700; letter-spacing:-0.5px; }
  .hstat .l { font-size:11px; color:rgba(255,255,255,0.6); font-weight:500; margin-top:2px; }
  .hstat .n.danger { color:#ff7088; }

  /* Tabs */
  .tabs { display:flex; gap:6px; padding:16px 16px 6px; overflow-x:auto; position:sticky; top:0; background:var(--bg); z-index:10; -ms-overflow-style:none; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { border:none; background:var(--surface); color:var(--text-2); padding:8px 15px; border-radius:11px; font-size:13.5px; font-weight:600; white-space:nowrap; cursor:pointer; transition:0.2s; font-family:inherit; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
  .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tab .count { opacity:0.55; margin-left:5px; font-size:11.5px; }

  /* List & task */
  .list { padding:8px 16px; }
  .task { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px 15px 14px; margin-bottom:9px; display:flex; gap:13px; box-shadow:var(--shadow); transition:transform 0.15s, box-shadow 0.2s; position:relative; overflow:hidden; animation:enter 0.32s cubic-bezier(0.16,1,0.3,1); }
  .task:active { transform:scale(0.992); }
  @keyframes enter { from { opacity:0; transform:translateY(7px);} to { opacity:1; transform:translateY(0);} }
  .task::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; opacity:0.9; }
  .task.p-high::before { background:var(--red); }
  .task.p-mid::before { background:var(--amber); }
  .task.p-low::before { background:var(--accent); }
  .check { width:23px; height:23px; border-radius:8px; border:2px solid #cdd4df; flex-shrink:0; margin-top:1px; cursor:pointer; transition:0.18s; display:flex; align-items:center; justify-content:center; color:#fff; }
  .check svg { width:12px; height:12px; stroke-width:3.2; opacity:0; transform:scale(0.5); transition:0.18s; }
  .check.done { background:var(--green); border-color:var(--green); }
  .check.done svg { opacity:1; transform:scale(1); }
  .body { flex:1; min-width:0; cursor:pointer; }
  .title { font-size:15px; font-weight:600; word-break:break-word; letter-spacing:-0.2px; }
  .task.completed .title { text-decoration:line-through; color:var(--text-3); font-weight:500; }
  .desc { font-size:13px; color:var(--text-2); margin-top:3px; word-break:break-word; }
  .meta { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:11.5px; font-weight:600; padding:3.5px 9px; border-radius:8px; display:inline-flex; align-items:center; gap:4px; color:var(--text-2); background:var(--surface-2); border:1px solid var(--border); }
  .chip.date svg { color:var(--text-3); }
  .chip.due-soon { background:var(--amber-soft); color:var(--amber); border-color:transparent; }
  .chip.overdue { background:var(--red-soft); color:var(--red); border-color:transparent; }
  .chip.remind { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  .chip.repeat { background:var(--green-soft); color:var(--green); border-color:transparent; }
  .chip.pri-high { background:var(--red-soft); color:var(--red); border-color:transparent; }
  .chip.pri-mid { background:var(--amber-soft); color:var(--amber); border-color:transparent; }
  .chip.pri-low { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  .del { background:none; border:none; color:#cdd4df; cursor:pointer; padding:3px; flex-shrink:0; align-self:flex-start; transition:0.15s; }
  .del:active { color:var(--red); }
  .empty { text-align:center; padding:64px 24px; color:var(--text-3); }
  .empty .ic svg { width:46px; height:46px; stroke-width:1.4; margin:0 auto 14px; color:#cdd4df; }
  .empty p { font-size:14px; }

  /* Review */
  .review-cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:8px 16px 4px; }
  .rcard { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:17px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .rcard::after { content:''; position:absolute; top:-20px; right:-20px; width:70px; height:70px; background:radial-gradient(circle, var(--accent-soft), transparent 70%); }
  .rcard .rnum { font-size:28px; font-weight:700; letter-spacing:-1px; color:var(--ink); position:relative; }
  .rcard .rlabel { font-size:12px; color:var(--text-2); font-weight:600; margin-top:3px; position:relative; }
  .review-group { padding:4px 16px; }
  .review-group .rg-date { font-size:13px; font-weight:700; color:var(--text-2); margin:18px 0 9px; }
  .review-group .rg-date span { color:var(--text-3); font-weight:500; }
  .review-item { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 14px; margin-bottom:7px; display:flex; align-items:center; gap:11px; box-shadow:var(--shadow-sm); }
  .review-item .ri-dot { width:17px; height:17px; border-radius:6px; background:var(--green); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .review-item .ri-dot svg { width:10px; height:10px; stroke:#fff; stroke-width:3.2; }
  .review-item .ri-title { font-size:14px; color:var(--text-2); text-decoration:line-through; }

  /* Composer */
  .composer { position:fixed; bottom:0; left:0; right:0; z-index:50; background:rgba(255,255,255,0.82); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--border); padding:11px 14px calc(11px + env(safe-area-inset-bottom)); display:flex; gap:9px; }
  .composer input { flex:1; border:1px solid var(--border); background:var(--surface-2); border-radius:13px; padding:13px 14px; font-size:15px; outline:none; font-family:inherit; transition:0.15s; color:var(--text); }
  .composer input:focus { border-color:var(--accent); background:var(--surface); }
  .cbtn { border:none; border-radius:13px; width:48px; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.15s; }
  .cbtn:active { transform:scale(0.93); }
  .mic-btn { background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }
  .mic-btn.listening { background:var(--red); color:#fff; border-color:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(217,45,79,0.4);} 50%{box-shadow:0 0 0 8px rgba(217,45,79,0);} }
  .detail-btn { background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }
  .add-btn { background:var(--accent); color:#fff; }
  .add-btn svg { width:22px; height:22px; stroke-width:2.3; }

  /* Sheet */
  .mask { position:fixed; inset:0; background:rgba(11,18,32,0.5); z-index:100; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
  .mask.show { display:flex; }
  .sheet { background:var(--surface); width:100%; max-width:520px; border-radius:24px 24px 0 0; padding:8px 22px calc(24px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; animation:rise 0.34s cubic-bezier(0.16,1,0.3,1); }
  @keyframes rise { from { transform:translateY(100%);} to { transform:translateY(0);} }
  .grab { width:38px; height:5px; background:var(--border); border-radius:99px; margin:8px auto 18px; }
  .sheet h3 { font-size:20px; font-weight:700; letter-spacing:-0.4px; margin-bottom:4px; }
  .sheet .sub { font-size:13px; color:var(--text-2); margin-bottom:18px; }
  .field { margin-bottom:16px; }
  .field > label { display:block; font-size:12.5px; font-weight:700; color:var(--text-2); margin-bottom:8px; letter-spacing:0; }
  .field input[type=text], .field textarea, .field input[type=datetime-local], .field input[type=date] { width:100%; border:1px solid var(--border); border-radius:12px; padding:13px; font-size:15px; outline:none; font-family:inherit; background:var(--surface-2); color:var(--text); transition:0.15s; }
  .field input:focus, .field textarea:focus { border-color:var(--accent); background:var(--surface); }
  .field textarea { resize:none; min-height:62px; }
  .titlewrap { position:relative; }
  .titlewrap input { padding-right:46px; }
  .titlewrap .mini-mic { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:9px; border:none; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .titlewrap .mini-mic.listening { background:var(--red); color:#fff; animation:pulse 1.2s infinite; }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1; }
  .seg { display:flex; gap:8px; }
  .seg .opt { flex:1; text-align:center; padding:11px; border-radius:12px; border:1.5px solid var(--border); cursor:pointer; font-size:14px; font-weight:600; color:var(--text-2); transition:0.15s; background:var(--surface-2); }
  .seg .opt.s-high { border-color:var(--red); background:var(--red-soft); color:var(--red); }
  .seg .opt.s-mid { border-color:var(--amber); background:var(--amber-soft); color:var(--amber); }
  .seg .opt.s-low { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .seg.rep { flex-wrap:wrap; }
  .seg.rep .opt { flex:1 1 22%; min-width:64px; }
  .seg.rep .opt.s-on { border-color:var(--green); background:var(--green-soft); color:var(--green); }
  .actions { display:flex; gap:10px; margin-top:24px; }
  .actions button { flex:1; padding:15px; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:0.15s; }
  .actions button:active { transform:scale(0.98); }
  .btn-ghost { background:var(--surface-2); color:var(--text-2); border:1px solid var(--border) !important; }
  .btn-primary { background:var(--accent); color:#fff; }
  .hint { display:flex; gap:8px; background:var(--amber-soft); color:var(--amber); font-size:12px; padding:11px 13px; border-radius:12px; margin-bottom:18px; line-height:1.45; align-items:flex-start; }
  .hint svg { width:15px; height:15px; flex-shrink:0; margin-top:1px; }

  .toast { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%) translateY(-160%); z-index:200; background:var(--ink); color:#fff; padding:13px 18px; border-radius:14px; font-size:14px; font-weight:600; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:9px; transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); max-width:90%; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast svg { width:18px; height:18px; color:#6ea8fe; flex-shrink:0; }
</style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="brand">My<span>Tasks</span></div>
      <div class="header-date" id="headerDate"></div>
    </div>
    <div class="lan">
      <div class="lan-text">
        <div class="lan-label" id="lanLabel">未连接时，任务只存在这台设备</div>
        <div class="lan-url" id="lanUrl">正在获取地址…</div>
        <div class="lan-meta" id="lanMeta"></div>
        <div class="lan-state" id="lanState">正在连接电脑…</div>
      </div>
      <img id="lanQr" alt="连接二维码" width="320" height="320" />
      <video id="lanScan" hidden playsinline style="border-radius:12px;background:#000"></video>
    </div>
    <div class="hero">
      <div class="ring">
        <svg viewBox="0 0 84 84">
          <circle class="bg" cx="42" cy="42" r="36" fill="none" stroke-width="7"/>
          <circle class="fg" id="ringFg" cx="42" cy="42" r="36" fill="none" stroke-width="7" stroke-dasharray="226.2" stroke-dashoffset="226.2"/>
        </svg>
        <div class="pct"><b id="ringPct">0%</b><s>完成度</s></div>
      </div>
      <div class="hstats">
        <div class="hstat"><div class="n" id="sActive">0</div><div class="l">进行中</div></div>
        <div class="hstat"><div class="n" id="sDone">0</div><div class="l">已完成</div></div>
        <div class="hstat"><div class="n danger" id="sOver">0</div><div class="l">已逾期</div></div>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-f="all">全部</button>
    <button class="tab" data-f="today">今天</button>
    <button class="tab" data-f="upcoming">即将到期</button>
    <button class="tab" data-f="overdue">已逾期</button>
    <button class="tab" data-f="done">已完成</button>
    <button class="tab" data-f="review">回顾</button>
  </nav>

  <main class="list" id="list"></main>

  <div class="composer">
    <input type="text" id="quickInput" placeholder="快速添加任务…" />
    <button class="cbtn mic-btn" id="micBtn" title="语音输入">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="cbtn detail-btn" id="detailBtn">
      <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
    </button>
    <button class="cbtn add-btn" id="quickAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <div class="mask" id="mask">
    <div class="sheet">
      <div class="grab"></div>
      <h3 id="sheetTitle">新建任务</h3>
      <p class="sub">填写细节，让任务更清晰可控。</p>
      <div class="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        <span>到点提醒需保持页面在前台并允许通知；锁屏或切到后台时网页提醒可能不准时。重复任务完成后会自动生成下一次。</span>
      </div>
      <div class="field">
        <label>任务标题</label>
        <div class="titlewrap">
          <input type="text" id="fTitle" placeholder="需要完成什么？" />
          <button class="mini-mic" id="fMic" type="button" title="语音输入">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>备注 / 描述</label>
        <textarea id="fDesc" placeholder="补充细节（可选）"></textarea>
      </div>
      <div class="field">
        <label>优先级</label>
        <div class="seg" id="priSeg">
          <div class="opt" data-p="low">低</div>
          <div class="opt" data-p="mid">中</div>
          <div class="opt" data-p="high">高</div>
        </div>
      </div>
      <div class="field">
        <label>重复</label>
        <div class="seg rep" id="repSeg">
          <div class="opt" data-r="none">不重复</div>
          <div class="opt" data-r="daily">每天</div>
          <div class="opt" data-r="weekly">每周</div>
          <div class="opt" data-r="monthly">每月</div>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>开始日期</label><input type="date" id="fStart" /></div>
        <div class="field"><label>截止日期</label><input type="date" id="fDue" /></div>
      </div>
      <div class="field">
        <label>提醒时间</label>
        <input type="datetime-local" id="fRemind" />
      </div>
      <div class="actions">
        <button class="btn-ghost" id="fCancel">取消</button>
        <button class="btn-primary" id="fSave">保存任务</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span id="toastText"></span>
  </div>

<script>
  var tasks=[], filter='all', editingId=null, selPri='mid', selRep='none';
  var RC=226.2; // 圆环周长

  var ICONS={
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>',

  };
  var REP_LABEL={none:'',daily:'每天',weekly:'每周',monthly:'每月'};

  var LOCAL_KEY='mytasks_sync_v1';
  var deleted=[];
  var localRev=0;
  var syncing=false;
  var syncQueued=false;
  var wasOffline=false;

  function api(method, path, body){
    var opts={method:method, headers:{'Content-Type':'application/json'}};
    if(body!==undefined) opts.body=JSON.stringify(body);
    return fetch(path, opts).then(function(r){
      if(r.status===204) return null;
      return r.json().then(function(data){
        if(!r.ok) throw new Error((data&&data.error)||('HTTP '+r.status));
        return data;
      });
    });
  }
  function loadLocal(){
    try{
      var d=JSON.parse(localStorage.getItem(LOCAL_KEY)||'');
      if(d&&Array.isArray(d.tasks)){ tasks=d.tasks; deleted=d.deleted||[]; }
    }catch(e){}
  }
  function saveLocal(){
    localRev++;
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({tasks:tasks, deleted:deleted})); }catch(e){}
  }
  function rememberServer(next){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({tasks:next.tasks||[], deleted:next.deleted||[]})); }catch(e){}
  }
  function setState(text, online){
    var el=document.getElementById('lanState');
    if(!el) return;
    el.textContent=text;
    el.className=online?'lan-state':'lan-state wait';
  }
  function mergeState(a, b){
    var tasksMap={}, tombs={};
    function takeTasks(list){
      (list||[]).forEach(function(t){
        if(!t||t.id==null||!String(t.title||'').trim()) return;
        var id=String(t.id), prev=tasksMap[id], at=Number(t.updatedAt)||0;
        if(!prev||at>(Number(prev.updatedAt)||0)) tasksMap[id]=t;
      });
    }
    function takeTombs(list){
      (list||[]).forEach(function(d){
        if(!d||d.id==null) return;
        var id=String(d.id), at=Number(d.updatedAt)||0;
        if(at>=(tombs[id]||0)) tombs[id]=at;
      });
    }
    takeTasks(a&&a.tasks); takeTasks(b&&b.tasks);
    takeTombs(a&&a.deleted); takeTombs(b&&b.deleted);
    var outTasks=[], used={};
    Object.keys(tasksMap).forEach(function(id){
      var t=tasksMap[id], del=tombs[id]||0;
      used[id]=1;
      if(del>(Number(t.updatedAt)||0)) return;
      outTasks.push(t);
    });
    var outDeleted=[];
    Object.keys(tombs).forEach(function(id){
      var t=tasksMap[id];
      if(!t||tombs[id]>(Number(t.updatedAt)||0)){
        outDeleted.push({id:/^\d+$/.test(id)?Number(id):id, updatedAt:tombs[id]});
      }
    });
    return {tasks:outTasks, deleted:outDeleted};
  }
  function newTask(partial){
    var t={id:Date.now()+Math.floor(Math.random()*1000), title:'', desc:'', pri:'mid', repeat:'none', start:null, due:null, remind:null, done:false, notified:false, completedAt:null, updatedAt:Date.now()};
    if(partial) Object.keys(partial).forEach(function(k){ t[k]=partial[k]; });
    t.updatedAt=Date.now();
    return t;
  }
  function sameState(aTasks, aDeleted){
    return JSON.stringify(aTasks)===JSON.stringify(tasks) && JSON.stringify(aDeleted||[])===JSON.stringify(deleted);
  }
  function syncNow(fromUser){
    if(document.getElementById('mask').classList.contains('show')) return Promise.resolve(false);
    if(syncing){ syncQueued=true; return Promise.resolve(false); }
    syncing=true;
    var rev=localRev;
    var payload={tasks:tasks.slice(), deleted:deleted.slice()};
    return api('PUT','/api/sync', payload).then(function(remote){
      var base=localRev===rev ? remote : mergeState({tasks:tasks, deleted:deleted}, remote);
      var changed=!sameState(base.tasks||[], base.deleted||[]);
      tasks=base.tasks||[];
      deleted=base.deleted||[];
      rememberServer({tasks:tasks, deleted:deleted});
      if(localRev!==rev) syncQueued=true;
      if(changed) render();
      if(wasOffline){ wasOffline=false; showToast('已同步到电脑'); }
      setState('已连上电脑', true);
      return true;
    }).catch(function(){
      if(!wasOffline && fromUser) showToast('已保存在手机，连上电脑后会自动同步');
      wasOffline=true;
      setState('未连上电脑，更改保存在本机', false);
      return false;
    }).then(function(ok){
      syncing=false;
      if(syncQueued){ syncQueued=false; return syncNow(false); }
      return ok;
    });
  }
  function commit(fromUser){
    saveLocal();
    render();
    if (link && link.readyState==='open') link.send(JSON.stringify({tasks:tasks, deleted:deleted, reply:false}));
  }
  var SITE = 'https://cheerinspit.github.io/tasks-app-public';
  var link = null;
  function isHost(){ return location.hostname==='127.0.0.1' || location.hostname==='localhost'; }
  var linked = false;
  function showQr(text){
    var svg = new QRCode({content:text, padding:4, width:640, height:640, ecl:'L'}).svg();
    document.getElementById('lanQr').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function wireChannel(ch){
    link = ch;
    ch.onopen = function(){
      linked = true;
      setState('已連結，正在同步', true);
      document.getElementById('lanLabel').textContent = '已連結';
      ch.send(JSON.stringify({tasks:tasks, deleted:deleted, reply:false}));
    };
    ch.onclose = function(){
      link = null;
      if (!linked) return;
      setState('连接已断开，数据仍在本机', false);
    };
    ch.onmessage = function(ev){
      var remote = JSON.parse(ev.data);
      var merged = mergeState({tasks:tasks, deleted:deleted}, remote);
      var changed = !sameState(merged.tasks||[], merged.deleted||[]);
      tasks = merged.tasks||[];
      deleted = merged.deleted||[];
      rememberServer({tasks:tasks, deleted:deleted});
      if (changed) render();
      setState('已連結', true);
      if (!remote.reply) ch.send(JSON.stringify({tasks:tasks, deleted:deleted, reply:true}));
    };
  }
  function waitIce(pc){
    return new Promise(function(resolve){
      if (pc.iceGatheringState === 'complete') return resolve();
      pc.addEventListener('icegatheringstatechange', function(){
        if (pc.iceGatheringState === 'complete') resolve();
      });
    });
  }
  function startHost(){
    var pc = new RTCPeerConnection({iceServers:[]});
    wireChannel(pc.createDataChannel('tasks'));
    pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).then(function(){ return waitIce(pc); }).then(function(){
      var sdp = pc.localDescription.sdp.split('\n').filter(function(line){
        if (line.indexOf('a=candidate:') !== 0) return true;
        return line.indexOf(' typ host') > 0 && line.indexOf(' 127.0.0.1 ') < 0;
      }).join('\n');
      var url = SITE + '/#o=' + encodeURIComponent(sdp);
      document.getElementById('lanUrl').textContent = '请用手机相机扫描';
      document.getElementById('lanMeta').textContent = '把手机拿近一点。扫码后手机会出现二维码，再点「读取手机二维码」。';
      showQr(url);
      window._pairPc = pc;
    }).catch(function(){ setState('无法生成连接码', false); });
  }
  function startGuest(sdp){
    var pc = new RTCPeerConnection({iceServers:[]});
    pc.ondatachannel = function(e){ wireChannel(e.channel); };
    pc.setRemoteDescription({type:'offer', sdp:sdp}).then(function(){ return pc.createAnswer(); }).then(function(a){
      return pc.setLocalDescription(a);
    }).then(function(){ return waitIce(pc); }).then(function(){
      document.getElementById('lanUrl').textContent = '请让电脑扫描此码';
      document.getElementById('lanMeta').textContent = '扫上后这里会显示已連結。';
      showQr(pc.localDescription.sdp);
      window._pairPc = pc;
    }).catch(function(){ setState('连接失败，请确认在同一 Wi‑Fi', false); });
  }
  function scanAnswer(){
    var box = document.getElementById('lanScan');
    if (!box) return;
    box.hidden = false;
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){
      box.srcObject = stream;
      box.play();
      var det = new BarcodeDetector({formats:['qr_code']});
      var timer = setInterval(function(){
        det.detect(box).then(function(codes){
          if (!codes[0]) return;
          clearInterval(timer);
          stream.getTracks().forEach(function(t){ t.stop(); });
          box.hidden = true;
          var sdp = codes[0].rawValue;
          window._pairPc.setRemoteDescription({type:'answer', sdp:sdp}).catch(function(){ setState('二维码无效', false); });
        }).catch(function(){});
      }, 400);
    }).catch(function(){ setState('无法打开摄像头', false); });
  }
  function loadLan(){
    if (isHost()) { startHost(); return; }
    var m = location.hash.match(/^#o=(.+)$/);
    if (m) { startGuest(decodeURIComponent(m[1])); return; }
    document.getElementById('lanUrl').textContent = '未连接';
    document.getElementById('lanMeta').textContent = '任务存在这台手机。连上电脑的 Wi‑Fi 后，用相机扫描电脑上的二维码才会同步。';
    setState('未連結', false);
  }
  function todayStr(){ return ymd(new Date()); }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function startOfDay(s){ return new Date(s+'T00:00:00').getTime(); }
  function fmtDate(s){
    if(!s) return '';
    var d=new Date(s+'T00:00:00'); var t=new Date(); t.setHours(0,0,0,0);
    var diff=Math.round((d-t)/86400000);
    if(diff===0) return '今天'; if(diff===1) return '明天'; if(diff===-1) return '昨天';
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
  }
  function fmtRemind(s){ if(!s) return ''; var d=new Date(s); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function isOverdue(t){ if(t.done||!t.due) return false; return startOfDay(t.due)<startOfDay(todayStr()); }
  function isDueSoon(t){ if(t.done||!t.due) return false; var diff=Math.round((startOfDay(t.due)-startOfDay(todayStr()))/86400000); return diff>=0&&diff<=2; }

  function advanceDate(s,rep){ var d=new Date(s+'T00:00:00'); if(rep==='daily')d.setDate(d.getDate()+1); else if(rep==='weekly')d.setDate(d.getDate()+7); else if(rep==='monthly')d.setMonth(d.getMonth()+1); return ymd(d); }
  function advanceRemind(s,rep){ var d=new Date(s); if(rep==='daily')d.setDate(d.getDate()+1); else if(rep==='weekly')d.setDate(d.getDate()+7); else if(rep==='monthly')d.setMonth(d.getMonth()+1); var p=function(n){return String(n).padStart(2,'0');}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }

  function renderHeader(){
    var d=new Date(); var w=['周日','周一','周二','周三','周四','周五','周六'];
    document.getElementById('headerDate').innerHTML=(d.getMonth()+1)+'月'+d.getDate()+'日<br>'+w[d.getDay()];
    var active=tasks.filter(function(t){return !t.done;}).length;
    var done=tasks.filter(function(t){return t.done;}).length;
    var over=tasks.filter(function(t){return isOverdue(t);}).length;
    document.getElementById('sActive').textContent=active;
    document.getElementById('sDone').textContent=done;
    document.getElementById('sOver').textContent=over;
    var total=tasks.length; var pct=total?Math.round(done/total*100):0;
    document.getElementById('ringPct').textContent=pct+'%';
    document.getElementById('ringFg').style.strokeDashoffset=RC-(RC*pct/100);
  }

  function passFilter(t){
    if(filter==='done') return t.done;
    if(filter==='today') return !t.done && t.due===todayStr();
    if(filter==='upcoming') return isDueSoon(t);
    if(filter==='overdue') return isOverdue(t);
    return true;
  }
  function updateTabCounts(){
    var c={all:tasks.length,today:tasks.filter(function(t){return !t.done&&t.due===todayStr();}).length,upcoming:tasks.filter(function(t){return isDueSoon(t);}).length,overdue:tasks.filter(function(t){return isOverdue(t);}).length,done:tasks.filter(function(t){return t.done;}).length,review:null};
    var labels={all:'全部',today:'今天',upcoming:'即将到期',overdue:'已逾期',done:'已完成',review:'回顾'};
    document.querySelectorAll('.tab').forEach(function(tab){var f=tab.dataset.f;var n=c[f];tab.innerHTML=labels[f]+(n>0?' <span class="count">'+n+'</span>':'');});
  }

  function render(){
    renderHeader(); updateTabCounts();
    var list=document.getElementById('list');
    if(filter==='review'){ renderReview(list); return; }
    var arr=tasks.filter(passFilter); var pw={high:0,mid:1,low:2};
    arr.sort(function(a,b){
      if(a.done!==b.done) return a.done?1:-1;
      var ao=isOverdue(a),bo=isOverdue(b); if(ao!==bo) return ao?-1:1;
      var ad=a.due||'9999',bd=b.due||'9999'; if(ad!==bd) return ad<bd?-1:1;
      return pw[a.pri]-pw[b.pri];
    });
    if(arr.length===0){ list.innerHTML='<div class="empty"><div class="ic">'+ICONS.inbox+'</div><p>这里暂时没有任务</p></div>'; return; }
    var html='';
    arr.forEach(function(t){
      var priLabel={high:'高',mid:'中',low:'低'}[t.pri];
      var chips='<span class="chip pri-'+t.pri+'">'+ICONS.flag+priLabel+'</span>';
      if(t.repeat&&t.repeat!=='none') chips+='<span class="chip repeat">'+ICONS.repeat+REP_LABEL[t.repeat]+'</span>';
      if(t.start) chips+='<span class="chip date">'+ICONS.play+'始 '+fmtDate(t.start)+'</span>';
      if(t.due){ var cls='date'; if(isOverdue(t))cls='overdue'; else if(isDueSoon(t))cls='due-soon'; chips+='<span class="chip '+cls+'">'+ICONS.cal+'止 '+fmtDate(t.due)+'</span>'; }
      if(t.remind&&!t.done) chips+='<span class="chip remind">'+ICONS.bell+fmtRemind(t.remind)+'</span>';
      html+='<div class="task p-'+t.pri+(t.done?' completed':'')+'">'
        +'<div class="check '+(t.done?'done':'')+'" onclick="toggle('+t.id+')">'+ICONS.check+'</div>'
        +'<div class="body" onclick="openEdit('+t.id+')"><div class="title">'+esc(t.title)+'</div>'
        +(t.desc?'<div class="desc">'+esc(t.desc)+'</div>':'')+'<div class="meta">'+chips+'</div></div>'
        +'<button class="del" onclick="del('+t.id+')">'+ICONS.trash+'</button></div>';
    });
    list.innerHTML=html;
  }

  function renderReview(list){
    var doneTasks=tasks.filter(function(t){return t.done&&t.completedAt;});
    var now=new Date(); var todayY=todayStr();
    var ws=new Date(); var day=(ws.getDay()+6)%7; ws.setDate(ws.getDate()-day); ws.setHours(0,0,0,0); var weekStart=ws.getTime();
    var monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    var cToday=0,cWeek=0,cMonth=0,cTotal=doneTasks.length;
    doneTasks.forEach(function(t){var ca=new Date(t.completedAt); if(ymd(ca)===todayY)cToday++; if(ca.getTime()>=weekStart)cWeek++; if(ca.getTime()>=monthStart)cMonth++;});
    var html='<div class="review-cards">'
      +'<div class="rcard"><div class="rnum">'+cToday+'</div><div class="rlabel">今天完成</div></div>'
      +'<div class="rcard"><div class="rnum">'+cWeek+'</div><div class="rlabel">本周完成</div></div>'
      +'<div class="rcard"><div class="rnum">'+cMonth+'</div><div class="rlabel">本月完成</div></div>'
      +'<div class="rcard"><div class="rnum">'+cTotal+'</div><div class="rlabel">累计完成</div></div></div>';
    if(doneTasks.length===0){ html+='<div class="empty"><div class="ic">'+ICONS.inbox+'</div><p>还没有完成记录，完成任务后会出现在这里</p></div>'; list.innerHTML=html; return; }
    var groups={}; doneTasks.forEach(function(t){var k=ymd(new Date(t.completedAt)); (groups[k]=groups[k]||[]).push(t);});
    var keys=Object.keys(groups).sort(function(a,b){return a<b?1:-1;});
    var w=['周日','周一','周二','周三','周四','周五','周六'];
    html+='<div class="review-group">';
    keys.forEach(function(k){
      var d=new Date(k+'T00:00:00'); var label=fmtDate(k);
      var sub=(d.getMonth()+1)+'月'+d.getDate()+'日 '+w[d.getDay()];
      var head=(label==='今天'||label==='昨天')?(label+' · '+w[d.getDay()]):sub;
      html+='<div class="rg-date">'+head+' <span>· '+groups[k].length+' 项</span></div>';
      groups[k].forEach(function(t){ html+='<div class="review-item"><div class="ri-dot">'+ICONS.check+'</div><div class="ri-title">'+esc(t.title)+'</div></div>'; });
    });
    html+='</div>'; list.innerHTML=html;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function addQuick(title){
    if(!title.trim()) return;
    tasks.push(newTask({title:title.trim(),desc:'',pri:'mid',repeat:'none',start:null,due:null,remind:null,done:false}));
    commit(true);
  }

  window.toggle=function(id){
    var t=tasks.find(function(x){return x.id===id;}); if(!t) return;
    if(!t.done){
      t.done=true; t.completedAt=Date.now(); t.updatedAt=Date.now();
      if(t.repeat&&t.repeat!=='none'){
        tasks.push(newTask({title:t.title,desc:t.desc,pri:t.pri,repeat:t.repeat,start:t.start?advanceDate(t.start,t.repeat):null,due:t.due?advanceDate(t.due,t.repeat):null,remind:t.remind?advanceRemind(t.remind,t.repeat):null,done:false,notified:false}));
        showToast('已完成，已生成下一次：'+REP_LABEL[t.repeat]);
      }
    }else{
      t.done=false; t.completedAt=null; t.updatedAt=Date.now();
    }
    commit(true);
  };
  window.del=function(id){
    deleted.push({id:id, updatedAt:Date.now()});
    tasks=tasks.filter(function(x){return x.id!==id;});
    commit(true);
  };

  document.querySelectorAll('#repSeg .opt').forEach(function(o){o.onclick=function(){setRep(o.dataset.r);};});

  function closeModal(){ document.getElementById('mask').classList.remove('show'); }

  document.getElementById('fSave').onclick=function(){
    var title=document.getElementById('fTitle').value.trim();
    if(!title){ document.getElementById('fTitle').focus(); return; }
    var data={title:title,desc:document.getElementById('fDesc').value.trim(),pri:selPri,repeat:selRep,start:document.getElementById('fStart').value||null,due:document.getElementById('fDue').value||null,remind:document.getElementById('fRemind').value||null};
    if(editingId){
      var t=tasks.find(function(x){return x.id===editingId;});
      if(!t) return;
      if(data.remind!==t.remind) t.notified=false;
      Object.assign(t, data);
      t.updatedAt=Date.now();
    }else{
      tasks.push(newTask(data));
    }
    document.getElementById('quickInput').value='';
    if(data.remind) reqPerm();
    closeModal();
    commit(true);
  };
  document.getElementById('fCancel').onclick=closeModal;
  document.getElementById('mask').onclick=function(e){ if(e.target.id==='mask') closeModal(); };
  document.getElementById('quickAdd').onclick=function(){ var i=document.getElementById('quickInput'); addQuick(i.value); i.value=''; };
  document.getElementById('quickInput').addEventListener('keydown',function(e){ if(e.key==='Enter'){ addQuick(e.target.value); e.target.value=''; } });
  document.getElementById('detailBtn').onclick=openNew;
  document.querySelectorAll('.tab').forEach(function(tab){tab.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});tab.classList.add('active');filter=tab.dataset.f;render();};});

  /* 语音输入 */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  function startVoice(targetInput,btn){
    if(!SR){ showToast('此浏览器不支持语音，请用键盘的麦克风'); return; }
    var rec=new SR(); rec.lang='zh-CN'; rec.interimResults=false; rec.maxAlternatives=1;
    btn.classList.add('listening');
    rec.onresult=function(e){ var txt=e.results[0][0].transcript; targetInput.value=(targetInput.value?targetInput.value+' ':'')+txt; };
    rec.onerror=function(){ showToast('没听清，请再试一次'); };
    rec.onend=function(){ btn.classList.remove('listening'); };
    try{ rec.start(); }catch(e){ btn.classList.remove('listening'); }
  }
  document.getElementById('micBtn').onclick=function(){ startVoice(document.getElementById('quickInput'),this); };
  document.getElementById('fMic').onclick=function(){ startVoice(document.getElementById('fTitle'),this); };

  function reqPerm(){ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }
  function ding(){
    try{ var ctx=new (window.AudioContext||window.webkitAudioContext)();
      [880,1175].forEach(function(f,i){ var o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f; var t0=ctx.currentTime+i*0.18; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.4); o.start(t0);o.stop(t0+0.4); });
    }catch(e){}
  }
  function showToast(text){ document.getElementById('toastText').textContent=text; var el=document.getElementById('toast'); el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},4000); }
  function checkReminders(){
    var now=Date.now();
    tasks.forEach(function(t){
      if(t.remind&&!t.notified&&!t.done&&new Date(t.remind).getTime()<=now){
        t.notified=true; t.updatedAt=Date.now(); saveLocal(); syncNow(false); ding();
        if('Notification' in window && Notification.permission==='granted'){ try{new Notification('任务提醒',{body:t.title});}catch(e){showToast(t.title);} } else { showToast(t.title); }
      }
    });
  }
  setInterval(checkReminders,10000);

  function seedIfEmpty(){
    if(tasks.length>0) return Promise.resolve();
    var t=new Date(); var tomorrow=new Date(t.getTime()+86400000);
    tasks=[
      newTask({title:'欢迎使用 MyTasks',desc:'点这条任务可编辑详情；左边方框打勾表示完成。',pri:'mid',repeat:'none',start:ymd(t),due:ymd(tomorrow),remind:null,done:false}),
      newTask({title:'试试重复任务',desc:'新建任务时把「重复」设为每天，完成后会自动生成下一次。',pri:'high',repeat:'daily',start:null,due:ymd(t),remind:null,done:false}),
      newTask({title:'这是一条已完成的示例',desc:'',pri:'low',repeat:'none',start:null,due:null,remind:null,done:true,completedAt:Date.now()})
    ];
    return commit(false);
  }

  loadLocal();
  render();
  loadLan();
  if (tasks.length===0 && isHost()) seedIfEmpty();
  reqPerm();
  if (isHost()) {
    var btn = document.createElement('button');
    btn.textContent = '读取手机二维码';
    btn.style.cssText = 'margin-top:6px;border:0;border-radius:8px;padding:6px 8px;font-weight:700';
    btn.onclick = scanAnswer;
    document.querySelector('.lan-text').appendChild(btn);
  }
  window.addEventListener('online', function(){});
  if('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('/sw.js').catch(function(){});
</script>
